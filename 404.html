<!doctype html>
<html lang="es">
<head>
<!-- 404.html: el servidor la muestra para CUALQUIER ruta inexistente, a cualquier profundidad.
     Por eso es el único archivo con rutas que empiezan con "/" (no relativas). Sin scripts (no refleja la URL pedida). -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · Jagā</title>
<meta name="description" content="La página que buscás no existe o se mudó. Volvé al inicio para encontrar lo que necesitás.">
<link rel="stylesheet" href="/jaga-shared.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="hub-header">
  <div class="wrap">
    <a href="/"><img class="hub-logo" src="/img/jaga-logo.png" width="308" height="96" alt="Jagā — inicio"></a>
  </div>
</header>
<main id="inicio" class="hub-404">
  <div class="wrap">
    <h1>No encontramos esa página</h1>
    <p>Puede que el enlace esté viejo o tenga un error de tipeo.</p>
    <p><a class="jaga-btn jaga-btn--primary" href="/">Volver al inicio</a></p>
    <ul class="hub-404__brands" aria-label="Marcas Jagā">
      <li><a href="https://mantenimiento.jagasoluciones.com/">Mantenimiento</a></li>
      <li><a href="https://design.jagasoluciones.com/">Digital Design</a></li>
      <li><a href="https://security.jagasoluciones.com/">Security</a></li>
    </ul>
  </div>
</main>
</body>
</html>
